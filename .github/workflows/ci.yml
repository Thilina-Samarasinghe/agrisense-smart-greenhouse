name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  database:
    name: Database (Prisma migrations on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agrisense
          POSTGRES_PASSWORD: agrisense
          POSTGRES_DB: agrisense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrisense -d agrisense"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://agrisense:agrisense@localhost:5432/agrisense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Prisma
        working-directory: database
        run: npm install --no-audit --no-fund
      - name: Validate schema
        working-directory: database
        run: npx prisma validate
      - name: Apply migrations to an empty database
        working-directory: database
        run: npx prisma migrate deploy
      - name: Migrations produce exactly schema.prisma (no drift)
        working-directory: database
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Backend works on the Prisma-managed schema
        working-directory: backend
        env:
          AGRISENSE_TEST_POSTGRES_URL: postgresql://agrisense:agrisense@localhost:5432/agrisense
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_postgres.py tests/test_schema_sync.py

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: agrisense-backend:ci
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: agrisense-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: database
          push: false
          tags: agrisense-migrate:ci
