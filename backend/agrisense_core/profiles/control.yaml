# Automation settings. Crop-specific targets (temperature, humidity, soil moisture, DLI)
# come from crops.yaml; this file holds controller behaviour and safety limits.
interval_s: 10            # control loop period (simulated seconds)
command_ttl_s: 60         # actuators switch off if no command refresh arrives in time
day_window: ["06:00", "18:30"]   # day vs night temperature targets
violation_sustain_s: 1800 # out of range this long raises a warning

climate:
  temp_band_c: 1.5            # fan hysteresis: OFF at (max - band)
  stage1_level: 0.5           # fan speed for stage 1
  stage2_offset_c: 2.0        # full speed at (max + offset)
  vent_benefit_on_c: 1.0      # start ventilating only if inside is this much warmer than outside
  vent_benefit_off_c: -0.5    # stop if outside becomes this much warmer than inside
  humidity_band_pct: 5
  humidity_vent_start_ratio: 0.90  # vent for humidity only if outside air holds < 90 % of the water
  humidity_vent_stop_ratio: 0.98
  emergency_temp_c: 40        # forces fans to 100 % whatever the mode
  emergency_clear_c: 37
  mist_cooling_offset_c: 2.0  # evaporative cooling above (max + offset) if the air is dry enough
  mist_rh_margin_pct: 5

irrigation:
  stop_fraction: 0.6          # stop at min + 0.6 * (max - min) of the crop VWC band
  max_cycle_s: 10800          # longest single irrigation (drip raises VWC ~1.5-2 %/h); then soak and alert
  soak_s: 900
  critical_dry_margin: 0.02   # SOIL_DRY alert below wilting point + margin
  fallback_interval_s: 21600  # without healthy soil sensors: water on a timer
  fallback_duration_s: 600

lighting:
  window: ["06:00", "20:00"]  # supplementary lighting allowed
  off_above_sun_par: 400      # lamps are pointless when the sun is this bright
  sun_par_band: 50
  deficit_on_fraction: 0.1    # ON when behind the DLI pace by 10 % of the crop minimum

tank:
  low_pct: 20
  critical_pct: 10            # pump and misters locked out
  release_pct: 15             # lockout released above this level

pump:
  max_run_s: 14400           # continuous-duty drip pump; protects against a stuck cycle
  cooldown_s: 600
  no_flow_grace_s: 30         # pump on this long with no flow: latched PUMP_NO_FLOW
  no_flow_lpm: 0.5

sensors:
  stale_after_s: 30           # at least 3 sample intervals are always allowed
  stuck_window_s: 600
  stuck_quantities: [air_temp, air_rh, soil_vwc, co2_ppm]
  spike_limit: 3              # this many implausible jumps within the window: fault
  spike_window_s: 300
  disagreement_vwc_pct: 6     # two soil probes in one bed should agree within this
  ranges:                     # physically plausible values in a greenhouse
    air_temp: [-10, 60]
    air_rh: [0, 100]
    soil_vwc: [0, 60]
    soil_temp: [-5, 60]
    light_lux: [0, 200000]
    co2_ppm: [150, 5000]
    tank_level: [0, 100]
    flow_lpm: [0, 60]
  max_rate_per_s:             # faster changes than this are treated as spikes
    air_temp: 0.5
    air_rh: 3.0
    soil_vwc: 1.0
    soil_temp: 0.2
    co2_ppm: 50
    tank_level: 1.0

min_times_s:                  # [min ON, min OFF] for automatic decisions
  fan: [300, 120]
  valve: [60, 60]
  pump: [0, 30]
  grow_light: [600, 600]
  mister: [60, 300]           # pulse misting
  heater: [300, 300]
